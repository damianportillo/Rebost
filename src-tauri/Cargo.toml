[package]
name = "rebost"
version = "1.0.0"
description = "Private AI that works with your files."
authors = ["Frontierz", "Pau Garcia-Mila <info-rebost-app@frontierz.com>"]
license = "MIT"
# About Rebost and the in-app updater read this. Change it if the GitHub repo moves.
repository = "https://github.com/Frontierz-AI/Rebost"
homepage = "https://github.com/Frontierz-AI/Rebost"
documentation = "https://github.com/Frontierz-AI/Rebost#readme"
readme = "../README.md"
rust-version = "1.99"
edition = "2021"

[lib]
name = "rebost"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
# Desktop shell
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-log = "2.10.1"
tauri-plugin-opener = "2.7.2"
tauri-plugin-os = "2.4.0"
# No `zip` feature: Windows updates ship as a bare NSIS `.exe` (scripts/latest-json.mjs),
# so the zipped-artifact path, and the zip 4 crate it pulls in, is never used.
tauri-plugin-updater = { version = "2.14.1", default-features = false, features = [
    "rustls-tls",
    "system-proxy",
] }
tauri-plugin-window-state = "2.5.0"

# Document understanding. Only the formats and analysis passes Rebost uses are
# enabled so the binary stays lean and fully offline. OCR is vendored
# tesseract, statically linked, with English data bundled at build time.
# Extra `*.traineddata` packs in `resources/tessdata/` are copied on first extract.
xberg = { version = "1.3.10", default-features = false, features = [
    "tokio-runtime",
    "simd-utf8",
    "pdf",
    "excel",
    "office",
    "email",
    "html",
    "xml",
    "language-detection",
    "keywords",
    "keywords-yake",
    "summarization",
    "ocr",
    "bundle-tessdata-eng",
] }

# Local retrieval
tantivy = "0.27.0"
tantivy-stemmers = { version = "0.4.0", default-features = false, features = [
    "armenian_mkrtchyan",
    "basque",
    "catalan",
    "czech_dolamic_light",
    "estonian_freienthal",
    "hindi_lightweight",
    "indonesian_tala",
    "irish_gaelic",
    "lithuanian_jocas",
    "nepali",
    "polish_yarovoy",
    "yiddish_urieli",
] }

# Privacy
pii-vault = "0.2.0"

# Core plumbing
notify = "8.2.1"
tokio = { version = "1.54.1", features = ["full"] }
reqwest = { version = "0.13.5", features = ["json", "stream", "gzip", "query", "charset", "http2"] }
bytes = "1"
base64 = "0.23"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml_ng = "0.10.0"
sysinfo = { version = "0.39.6", default-features = false, features = ["system", "disk"] }
sha2 = "0.11.1"
# File identity (dev+inode, volume serial+file index) for safe model moves.
same-file = "1.0.6"

# Support
regex = "1"
anyhow = "1"
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.29.0", features = ["v4"] }
futures-util = "0.3"
tar = "0.4"
flate2 = "1"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }
dirs = "7"
readabilityrs = "0.1.4"
url = "2.5.8"
rust-i18n = "4.2.4"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", features = ["NSData", "NSDictionary"] }
objc2-app-kit = { version = "0.3.2", features = [
    "NSView",
    "NSBitmapImageRep",
    "NSImageRep",
] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[lints.clippy]
too_many_arguments = "allow"
undocumented_unsafe_blocks = "warn"
unused_result_ok = "warn"

[profile.release]
strip = true
lto = "thin"
